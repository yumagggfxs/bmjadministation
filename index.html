<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMJ SERVICE</title>
     <link rel="icon" type="image/png" href="images/logo.png">

    <link rel="shortcut icon" href="images/logo.png">

    <link rel="apple-touch-icon" href="images/logo.png">

</head>

<style>

/* ============================================================
   BMJ SERVICE — ADMINISTRATION
   STYLE PREMIUM DARK MULTICOLOR
   ============================================================ */

/* ============================================================
   1. VARIABLES
============================================================ */

:root {

    --black-1: #090b0f;
    --black-2: #0e1117;
    --black-3: #131821;
    --black-4: #181e28;
    --black-5: #202734;

    --blue: #1687d9;
    --blue-light: #35a9ff;
    --blue-dark: #0c5e9d;

    --gold: #d9a441;
    --gold-light: #f0c766;
    --gold-dark: #9e7020;

    --green: #25b77a;
    --green-light: #43d997;
    --green-dark: #167a53;

    --orange: #e58a32;
    --orange-light: #ffad52;

    --red: #dc5362;
    --red-light: #ff7180;

    --purple: #8058d9;
    --purple-light: #a47df5;

    --cyan: #18a8b8;
    --cyan-light: #42d4df;

    --text: #f1f4f8;
    --text-soft: #c1c9d4;
    --text-muted: #7f8b9b;
    --text-dark: #10141a;

    --border: rgba(255,255,255,.08);
    --border-light: rgba(255,255,255,.13);

    --shadow: 0 15px 45px rgba(0,0,0,.38);
    --shadow-soft: 0 8px 25px rgba(0,0,0,.25);

    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 20px;

    --transition: .25s ease;

}


/* ============================================================
   2. RESET
============================================================ */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;

    font-family:
        "Poppins",
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(22,135,217,.08),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(128,88,217,.07),
            transparent 30%
        ),
        var(--black-1);

    color: var(--text);

    overflow-x: hidden;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

img {
    max-width: 100%;
}

::selection {
    background: rgba(22,135,217,.35);
    color: #fff;
}


/* ============================================================
   3. SCROLLBAR
============================================================ */

::-webkit-scrollbar {
    width: 9px;
    height: 9px;
}

::-webkit-scrollbar-track {
    background: #080a0e;
}

::-webkit-scrollbar-thumb {
    background: #303846;
    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--blue);
}


/* ============================================================
   4. LOGIN
============================================================ */

#adminLogin {

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 35px 20px;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(22,135,217,.18),
            transparent 32%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(128,88,217,.15),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #07090d,
            #10151d 50%,
            #0a0d12
        );

    position: relative;
    overflow: hidden;
}

#adminLogin::before {

    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    border: 1px solid rgba(22,135,217,.12);

    top: -250px;
    right: -150px;
}

#adminLogin::after {

    content: "";

    position: absolute;

    width: 400px;
    height: 400px;

    border-radius: 50%;

    border: 1px solid rgba(217,164,65,.10);

    bottom: -220px;
    left: -120px;
}


.login-wrapper {

    width: 100%;
    max-width: 1150px;

    display: grid;

    grid-template-columns:
        minmax(0, 1.1fr)
        minmax(380px, .9fr);

    background: #10141b;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 24px;

    overflow: hidden;

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 0 0 1px rgba(22,135,217,.04);

    position: relative;
    z-index: 2;
}


/* ============================================================
   LOGIN BRAND
============================================================ */

.login-brand {

    padding: 60px 55px;

    position: relative;

    background:

        linear-gradient(
            145deg,
            #101923,
            #111821 45%,
            #0c1118
        );

    border-right: 1px solid rgba(255,255,255,.07);

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.login-brand::before {

    content: "";

    position: absolute;

    width: 260px;
    height: 260px;

    border-radius: 50%;

    background: rgba(22,135,217,.10);

    filter: blur(5px);

    top: -120px;
    right: -90px;
}


.login-logo {

    width: 78px;
    height: 78px;

    object-fit: contain;

    margin-bottom: 22px;

    border-radius: 16px;

    filter:
        drop-shadow(0 10px 20px rgba(0,0,0,.4));
}


.login-brand h1 {

    margin: 0 0 12px;

    font-size: 38px;
    line-height: 1.1;

    font-weight: 800;

    letter-spacing: -.8px;

    color: #ffffff;
}

.login-brand h1 span {
    color: var(--gold);
}


.login-brand > p {

    margin: 0;

    max-width: 600px;

    color: var(--text-muted);

    font-size: 14px;

    line-height: 1.8;
}


/* ============================================================
   LOGIN FEATURES
============================================================ */

.login-features {

    margin-top: 35px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}

.login-feature {

    display: flex;

    align-items: center;

    gap: 12px;

    min-height: 58px;

    padding: 13px 15px;

    border-radius: 12px;

    background: rgba(255,255,255,.035);

    border: 1px solid rgba(255,255,255,.065);

    color: var(--text-soft);

    font-size: 12px;

    transition: var(--transition);
}

.login-feature:hover {

    transform: translateY(-3px);

    background: rgba(22,135,217,.08);

    border-color: rgba(22,135,217,.3);

}

.login-feature i {

    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;

    color: var(--blue-light);

    background: rgba(22,135,217,.12);

    font-size: 14px;
}


/* ============================================================
   LOGIN PANEL
============================================================ */

.login-panel {

    padding: 50px 42px;

    background:
        linear-gradient(
            145deg,
            #171c25,
            #12161d
        );

    display: flex;
    flex-direction: column;
    justify-content: center;

    position: relative;
}

.login-panel::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 4px;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple),
            var(--gold)
        );
}


.login-panel h2 {

    margin: 0 0 9px;

    color: #ffffff;

    font-size: 26px;

    font-weight: 750;
}

.login-panel > p {

    margin: 0 0 28px;

    color: var(--text-muted);

    font-size: 13px;

    line-height: 1.7;
}


/* ============================================================
   FORMULAIRES
============================================================ */

.form-group {
    margin-bottom: 19px;
}

.form-label {

    display: block;

    margin-bottom: 8px;

    color: #cfd6df;

    font-size: 12px;

    font-weight: 650;

    letter-spacing: .2px;
}


.form-control {

    width: 100%;

    min-height: 46px;

    padding: 11px 14px;

    border-radius: 9px;

    border: 1px solid #303846;

    outline: none;

    background: #0c1016;

    color: #f5f7fa;

    font-size: 13px;

    transition: var(--transition);

}

.form-control::placeholder {
    color: #596474;
}

.form-control:hover {
    border-color: #465162;
}

.form-control:focus {

    border-color: var(--blue);

    background: #0d131b;

    box-shadow:
        0 0 0 3px rgba(22,135,217,.13);
}

textarea.form-control {

    min-height: 120px;

    resize: vertical;

    line-height: 1.6;
}

select.form-control {

    appearance: none;

    background-image:
        linear-gradient(45deg, transparent 50%, #7c8796 50%),
        linear-gradient(135deg, #7c8796 50%, transparent 50%);

    background-position:
        calc(100% - 17px) 20px,
        calc(100% - 12px) 20px;

    background-size: 5px 5px;

    background-repeat: no-repeat;
}


/* ============================================================
   LOGIN ERROR
============================================================ */

.login-error {

    display: none;

    margin-bottom: 18px;

    padding: 12px 14px;

    border-radius: 9px;

    color: #ff9ca5;

    background: rgba(220,83,98,.10);

    border: 1px solid rgba(220,83,98,.25);

    font-size: 12px;
}


/* ============================================================
   LOGIN FOOTER
============================================================ */

.login-footer {

    margin-top: 25px;

    padding-top: 20px;

    border-top: 1px solid rgba(255,255,255,.07);

    text-align: center;

    color: #606b79;

    font-size: 10px;

    letter-spacing: .3px;
}


/* ============================================================
   5. APPLICATION
============================================================ */

#adminApp {
    display: none;
}

.app-layout {

    min-height: 100vh;

    display: flex;

    background: #090c11;
}


/* ============================================================
   6. SIDEBAR
============================================================ */

#sidebar {

    width: 265px;

    flex-shrink: 0;

    min-height: 100vh;

    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            180deg,
            #0c1016,
            #10151d
        );

    border-right: 1px solid rgba(255,255,255,.07);

    position: sticky;
    top: 0;

    height: 100vh;

    z-index: 100;

    box-shadow:
        12px 0 35px rgba(0,0,0,.18);
}


/* ============================================================
   SIDEBAR BRAND
============================================================ */

.sidebar-brand {

    min-height: 82px;

    padding: 16px 20px;

    display: flex;
    align-items: center;

    gap: 12px;

    border-bottom: 1px solid rgba(255,255,255,.06);
}

.sidebar-brand img {

    width: 43px;
    height: 43px;

    object-fit: contain;

    border-radius: 9px;
}

.sidebar-brand strong {

    display: block;

    color: #ffffff;

    font-size: 14px;

    letter-spacing: .3px;
}

.sidebar-brand span {

    display: block;

    margin-top: 3px;

    color: var(--gold);

    font-size: 8px;

    letter-spacing: 1.5px;

    font-weight: 700;
}


/* ============================================================
   NAVIGATION
============================================================ */

.sidebar-nav {

    flex: 1;

    padding: 18px 12px;

    overflow-y: auto;
}

.nav-title {

    padding: 13px 12px 8px;

    color: #596576;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 1.5px;

    font-weight: 700;
}

.nav-item {

    width: 100%;

    min-height: 46px;

    border: 0;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 10px 12px;

    margin-bottom: 5px;

    border-radius: 9px;

    background: transparent;

    color: #8e99a8;

    text-align: left;

    font-size: 12px;

    transition: var(--transition);

    position: relative;
}

.nav-item i {

    width: 20px;

    text-align: center;

    font-size: 14px;

    color: #6f7b8b;
}

.nav-item:hover {

    background: rgba(255,255,255,.045);

    color: #ffffff;

    transform: translateX(2px);
}

.nav-item:hover i {
    color: var(--blue-light);
}

.nav-item.active {

    color: #ffffff;

    background:
        linear-gradient(
            90deg,
            rgba(22,135,217,.20),
            rgba(22,135,217,.07)
        );

    box-shadow:
        inset 3px 0 0 var(--blue);
}

.nav-item.active i {
    color: var(--blue-light);
}

.nav-item .badge {
    margin-left: auto;
}


/* ============================================================
   SIDEBAR ADMIN
============================================================ */

.sidebar-bottom {

    padding: 15px;

    border-top: 1px solid rgba(255,255,255,.06);
}

.admin-mini {

    display: flex;
    align-items: center;

    gap: 11px;

    padding: 11px;

    border-radius: 10px;

    background: #151b24;

    border: 1px solid rgba(255,255,255,.06);
}

.admin-mini-icon {

    width: 37px;
    height: 37px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    color: #fff;
}

.admin-mini-text {
    min-width: 0;
}

.admin-mini-text strong {

    display: block;

    overflow: hidden;

    color: #e9edf2;

    font-size: 10px;

    white-space: nowrap;
    text-overflow: ellipsis;
}

.admin-mini-text span {

    display: block;

    margin-top: 3px;

    color: #687485;

    font-size: 8px;
}


/* ============================================================
   7. MAIN
============================================================ */

.main {

    flex: 1;

    min-width: 0;

    background:

        radial-gradient(
            circle at 80% 0%,
            rgba(22,135,217,.045),
            transparent 25%
        ),

        #0b0f14;
}


/* ============================================================
   8. TOPBAR
============================================================ */

.topbar {

    height: 74px;

    padding: 0 28px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    background: rgba(13,17,23,.94);

    border-bottom: 1px solid rgba(255,255,255,.07);

    position: sticky;

    top: 0;

    z-index: 80;

    backdrop-filter: blur(15px);
}

.topbar-left {

    display: flex;
    align-items: center;

    gap: 14px;
}

#mobileMenu {

    display: none;

    width: 40px;
    height: 40px;

    border: 1px solid #303744;

    border-radius: 9px;

    background: #151a22;

    color: #d9e0e8;
}

#topTitle {

    color: #ffffff;

    font-size: 17px;

    font-weight: 700;
}

.top-subtitle {

    margin-top: 2px;

    color: #697587;

    font-size: 10px;
}

.topbar-right {

    display: flex;

    align-items: center;

    gap: 10px;
}


/* ============================================================
   HEALTH PILL
============================================================ */

.health-pill {

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 7px 10px;

    border-radius: 30px;

    background: rgba(37,183,122,.08);

    border: 1px solid rgba(37,183,122,.18);

    color: #76d8ae;

    font-size: 9px;

    font-weight: 600;
}

.health-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 0 4px rgba(37,183,122,.10),
        0 0 12px rgba(37,183,122,.5);
}


/* ============================================================
   ADMIN DISPLAY
============================================================ */

.admin-display {

    min-height: 38px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 0 11px;

    border-radius: 9px;

    background: #151a22;

    border: 1px solid #252d39;

    color: #9da8b6;

    font-size: 10px;

    max-width: 230px;
}

.admin-display i {
    color: var(--purple-light);
}

.admin-display span {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.logout-btn {

    width: 38px;
    height: 38px;

    border-radius: 9px;

    border: 1px solid #2b333f;

    background: #151a22;

    color: #909baa;

    transition: var(--transition);
}

.logout-btn:hover {

    color: #ffffff;

    border-color: var(--blue);

    background: rgba(22,135,217,.10);

    transform: translateY(-2px);
}

#logoutButton:hover {

    color: var(--red-light);

    border-color: rgba(220,83,98,.4);

    background: rgba(220,83,98,.08);
}


/* ============================================================
   9. CONTENT
============================================================ */

.content {

    padding: 30px;

    max-width: 1800px;

    margin: 0 auto;
}

.section {
    display: none;
}

.section.active {
    display: block;
}


/* ============================================================
   10. DASHBOARD HERO
============================================================ */

.overview-hero {

    margin-bottom: 22px;

    overflow: hidden;

    border-radius: 18px;

    border: 1px solid rgba(22,135,217,.20);

    background:

        radial-gradient(
            circle at 90% 20%,
            rgba(217,164,65,.16),
            transparent 30%
        ),

        linear-gradient(
            120deg,
            #101c29,
            #142431 55%,
            #111820
        );

    box-shadow: var(--shadow-soft);

    position: relative;
}

.overview-hero::after {

    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.05);

    right: -120px;
    top: -120px;
}

.overview-content {

    min-height: 200px;

    padding: 32px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 25px;

    position: relative;
    z-index: 2;
}

.overview-label {

    margin-bottom: 7px;

    color: var(--blue-light);

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 1.7px;

    font-weight: 800;
}

.overview-content h1 {

    margin: 0 0 9px;

    color: #ffffff;

    font-size: 29px;

    font-weight: 800;
}

.overview-content p {

    max-width: 760px;

    margin: 0;

    color: #8997a8;

    font-size: 12px;

    line-height: 1.75;
}

.overview-icon {

    width: 95px;
    height: 95px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 25px;

    background:
        linear-gradient(
            135deg,
            rgba(22,135,217,.25),
            rgba(128,88,217,.22)
        );

    border: 1px solid rgba(22,135,217,.25);

    color: var(--blue-light);

    font-size: 38px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.25);
}


/* ============================================================
   11. STAT CARDS
============================================================ */

.stats-grid {

    display: grid;

    grid-template-columns:
        repeat(5, minmax(0,1fr));

    gap: 13px;

    margin-bottom: 15px;
}

.stat-card {

    padding: 18px;

    min-height: 145px;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            #151b24,
            #11161e
        );

    border: 1px solid #252d39;

    position: relative;

    overflow: hidden;

    transition: var(--transition);
}

.stat-card::after {

    content: "";

    position: absolute;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: rgba(22,135,217,.06);

    right: -40px;
    bottom: -40px;
}

.stat-card:hover {

    transform: translateY(-4px);

    border-color: rgba(22,135,217,.35);

    box-shadow: var(--shadow-soft);
}

.stat-card.gold:hover {
    border-color: rgba(217,164,65,.4);
}

.stat-card.success:hover {
    border-color: rgba(37,183,122,.4);
}

.stat-card.warning:hover {
    border-color: rgba(229,138,50,.4);
}

.stat-top {

    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 16px;
}

.stat-icon {

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: rgba(22,135,217,.12);

    color: var(--blue-light);
}

.stat-card.gold .stat-icon {

    background: rgba(217,164,65,.13);

    color: var(--gold-light);
}

.stat-card.success .stat-icon {

    background: rgba(37,183,122,.12);

    color: var(--green-light);
}

.stat-card.warning .stat-icon {

    background: rgba(229,138,50,.12);

    color: var(--orange-light);
}

.stat-trend {

    color: #5f6b7b;

    font-size: 8px;

    letter-spacing: .9px;

    font-weight: 700;
}

.stat-value {

    color: #ffffff;

    font-size: 27px;

    line-height: 1;

    font-weight: 800;
}

.stat-label {

    margin-top: 8px;

    color: #778393;

    font-size: 10px;
}


/* ============================================================
   12. SECONDARY STATS
============================================================ */

.secondary-stats {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0,1fr));

    gap: 11px;

    margin-bottom: 15px;
}

.secondary-stat {

    min-height: 68px;

    padding: 13px 15px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    border-radius: 11px;

    background: #131922;

    border: 1px solid #252d38;

    position: relative;

    overflow: hidden;
}

.secondary-stat::before {

    content: "";

    width: 3px;

    position: absolute;

    left: 0;
    top: 12px;
    bottom: 12px;

    background: var(--blue);

    border-radius: 0 4px 4px 0;
}

.secondary-stat:nth-child(2)::before {
    background: var(--red);
}

.secondary-stat:nth-child(3)::before {
    background: var(--purple);
}

.secondary-stat:nth-child(4)::before {
    background: var(--gold);
}

.secondary-stat span {

    color: #7c8897;

    font-size: 10px;
}

.secondary-stat strong {

    color: #ffffff;

    font-size: 17px;

    font-weight: 800;
}


/* ============================================================
   13. DASHBOARD GRID
============================================================ */

.dashboard-grid {

    display: grid;

    grid-template-columns:
        minmax(0, 1.35fr)
        minmax(330px, .65fr);

    gap: 15px;
}

.dashboard-left,
.dashboard-right {

    min-width: 0;

    display: flex;
    flex-direction: column;

    gap: 15px;
}


/* ============================================================
   14. CARDS
============================================================ */

.card {

    background:
        linear-gradient(
            145deg,
            #151b24,
            #11161e
        );

    border: 1px solid #252d38;

    border-radius: 15px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);

    overflow: hidden;
}

.card-header {

    min-height: 68px;

    padding: 17px 19px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    border-bottom: 1px solid rgba(255,255,255,.055);
}

.card-header h3 {

    margin: 0;

    color: #e9edf2;

    font-size: 13px;

    font-weight: 700;
}

.card-header p {

    margin: 4px 0 0;

    color: #667384;

    font-size: 9px;
}

.card-body {
    padding: 18px;
}

.view-all {

    border: 0;

    background: transparent;

    color: var(--blue-light);

    font-size: 10px;

    font-weight: 700;
}


/* ============================================================
   15. OVERVIEW METRICS
============================================================ */

.overview-metrics {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0,1fr));

    gap: 10px;
}

.overview-metric {

    min-height: 112px;

    padding: 14px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    border-radius: 11px;

    background: #10151d;

    border: 1px solid #252d38;

    transition: var(--transition);
}

.overview-metric:hover {

    transform: translateY(-3px);

    border-color: #354052;
}

.overview-metric-icon {

    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 9px;

    border-radius: 9px;

    color: var(--blue-light);

    background: rgba(22,135,217,.10);
}

.overview-metric:nth-child(2) .overview-metric-icon {

    color: var(--gold-light);

    background: rgba(217,164,65,.10);
}

.overview-metric:nth-child(3) .overview-metric-icon {

    color: var(--red-light);

    background: rgba(220,83,98,.10);
}

.overview-metric:nth-child(4) .overview-metric-icon {

    color: var(--green-light);

    background: rgba(37,183,122,.10);
}

.overview-metric strong {

    color: #f1f4f7;

    font-size: 13px;
}

.overview-metric span {

    margin-top: 4px;

    color: #667384;

    font-size: 9px;
}


/* ============================================================
   16. PLATFORM STATUS
============================================================ */

.platform-status-item {

    min-height: 66px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 11px 0;

    border-bottom: 1px solid rgba(255,255,255,.055);
}

.platform-status-left {

    display: flex;

    align-items: center;

    gap: 10px;
}

.platform-status-icon {

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: rgba(22,135,217,.10);

    color: var(--blue-light);
}

.platform-status-left strong {

    display: block;

    color: #dce2e9;

    font-size: 10px;
}

.platform-status-left span {

    display: block;

    margin-top: 3px;

    color: #647181;

    font-size: 9px;
}

.status-badge {

    padding: 5px 8px;

    border-radius: 20px;

    color: #7ae0b5;

    background: rgba(37,183,122,.08);

    border: 1px solid rgba(37,183,122,.15);

    font-size: 8px;

    font-weight: 700;
}

.platform-details {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    padding-top: 13px;
}

.platform-detail {

    padding: 10px;

    border-radius: 8px;

    background: #10151d;

    border: 1px solid #222a35;
}

.platform-detail span {

    display: block;

    color: #687586;

    font-size: 8px;
}

.platform-detail strong {

    display: block;

    margin-top: 4px;

    color: #dce2e9;

    font-size: 11px;
}


/* ============================================================
   17. DIAGNOSTIC
============================================================ */

.health-json {

    min-height: 42px;

    margin-bottom: 9px;

    padding: 10px;

    border-radius: 8px;

    background: #090d12;

    border: 1px solid #202732;

    color: #8490a0;

    font-family:
        Consolas,
        Monaco,
        monospace;

    font-size: 9px;

    line-height: 1.6;

    overflow: auto;
}


/* ============================================================
   18. SECTION HEADINGS
============================================================ */

.section-heading {

    min-height: 65px;

    margin-bottom: 20px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.section-heading h2 {

    margin: 0;

    color: #f0f3f7;

    font-size: 23px;

    font-weight: 800;
}

.section-heading p {

    margin: 5px 0 0;

    color: #687586;

    font-size: 11px;
}


/* ============================================================
   19. BUTTONS
============================================================ */

.btn {

    min-height: 40px;

    padding: 9px 15px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    border: 1px solid transparent;

    border-radius: 8px;

    font-size: 11px;

    font-weight: 700;

    transition: var(--transition);
}

.btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(0,0,0,.25);
}

.btn:active {
    transform: translateY(0);
}


/* BLUE */

.btn-primary {

    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #167fc9,
            #1266a3
        );

    border-color: #1b83cb;
}

.btn-primary:hover {

    background:
        linear-gradient(
            135deg,
            #2298e8,
            #1678bd
        );
}


/* GOLD */

.btn-gold {

    color: #17130b;

    background:
        linear-gradient(
            135deg,
            #f0c766,
            #c89532
        );

    border-color: #d4a33d;
}


/* GREEN */

.btn-success {

    color: #06150f;

    background:
        linear-gradient(
            135deg,
            #42d997,
            #1d9b68
        );

    border-color: #32bb83;
}


/* RED */

.btn-danger {

    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #e36371,
            #b83f4e
        );

    border-color: #d45361;
}


/* LIGHT — PLUS BLANC */

.btn-light {

    color: #d8dfe7;

    background: #252d38;

    border-color: #394351;
}

.btn-light:hover {

    background: #303947;

    border-color: #485466;
}


/* SMALL */

.btn-sm {

    min-height: 34px;

    padding: 7px 11px;

    font-size: 9px;
}


/* ============================================================
   20. BADGES
============================================================ */

.badge {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-height: 21px;

    padding: 3px 8px;

    border-radius: 20px;

    font-size: 8px;

    font-weight: 750;

    white-space: nowrap;
}

.badge-primary {

    color: #6ec6ff;

    background: rgba(22,135,217,.13);

    border: 1px solid rgba(22,135,217,.2);
}

.badge-gold {

    color: #f0c766;

    background: rgba(217,164,65,.13);

    border: 1px solid rgba(217,164,65,.2);
}

.badge-success {

    color: #6fe1b0;

    background: rgba(37,183,122,.12);

    border: 1px solid rgba(37,183,122,.2);
}

.badge-danger {

    color: #ff8b98;

    background: rgba(220,83,98,.12);

    border: 1px solid rgba(220,83,98,.2);
}


/* ============================================================
   21. TOOLBAR
============================================================ */

.toolbar {

    min-height: 72px;

    padding: 14px 17px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    border-bottom: 1px solid rgba(255,255,255,.055);
}

.toolbar-left {

    display: flex;

    align-items: center;

    gap: 9px;

    flex-wrap: wrap;

    min-width: 0;
}

.toolbar-right {

    display: flex;

    align-items: center;

    gap: 8px;

    flex-wrap: wrap;
}

.search-box {

    position: relative;

    min-width: 260px;
}

.search-box > i {

    position: absolute;

    left: 13px;
    top: 50%;

    transform: translateY(-50%);

    color: #647080;

    font-size: 11px;

    z-index: 2;
}

.search-box .form-control {

    padding-left: 36px;
}

.filter-select {
    min-width: 150px;
}


/* ============================================================
   22. TABLES
============================================================ */

.table-wrap {

    width: 100%;

    overflow-x: auto;

    background: #11161e;
}

table {

    width: 100%;

    min-width: 750px;

    border-collapse: collapse;
}

thead {
    background: #0c1016;
}

th {

    padding: 13px 15px;

    text-align: left;

    color: #687586;

    border-bottom: 1px solid #252d38;

    font-size: 8px;

    text-transform: uppercase;

    letter-spacing: .7px;

    white-space: nowrap;
}

td {

    padding: 13px 15px;

    color: #bac3ce;

    border-bottom: 1px solid rgba(255,255,255,.045);

    font-size: 10px;

    vertical-align: middle;
}

tbody tr {

    transition: var(--transition);
}

tbody tr:hover {

    background: rgba(22,135,217,.045);
}

.empty {

    padding: 35px;

    text-align: center;

    color: #667384;

    font-size: 11px;
}


/* ============================================================
   23. PAGINATION
============================================================ */

.pagination {

    padding: 14px 17px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    border-top: 1px solid rgba(255,255,255,.055);
}

.pagination-info {

    color: #697586;

    font-size: 9px;
}

.pagination-info strong {
    color: #dfe4ea;
}

.pagination-controls {

    display: flex;

    gap: 6px;
}

.pagination-controls button {

    width: 33px;
    height: 33px;

    border-radius: 7px;

    border: 1px solid #2b3440;

    background: #171d26;

    color: #8995a4;
}

.pagination-controls button:hover {

    color: #ffffff;

    border-color: var(--blue);

    background: rgba(22,135,217,.10);
}


/* ============================================================
   24. HEALTH PAGE
============================================================ */

.health-grid {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.health-box {
    padding: 20px;
}

.health-status {

    display: flex;

    align-items: center;

    gap: 13px;

    margin-bottom: 17px;
}

.health-status-icon {

    width: 50px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    color: var(--blue-light);

    background:
        rgba(22,135,217,.11);

    border: 1px solid rgba(22,135,217,.18);

    font-size: 19px;
}

.health-status strong {

    display: block;

    color: #e8edf3;

    font-size: 13px;
}

.health-status span {

    display: block;

    margin-top: 4px;

    color: #687586;

    font-size: 10px;
}


/* ============================================================
   25. MODALS
============================================================ */

.modal {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,.76);

    backdrop-filter: blur(7px);

    overflow-y: auto;
}

.modal.active,
.modal[style*="display: block"],
.modal[style*="display:block"] {

    display: flex;
}

.modal-content {

    width: 100%;

    max-width: 720px;

    max-height: calc(100vh - 40px);

    display: flex;
    flex-direction: column;

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            #181e27,
            #11161e
        );

    border: 1px solid #303947;

    box-shadow:
        0 30px 90px rgba(0,0,0,.65);

    overflow: hidden;

    animation: modalIn .22s ease;
}

.modal-lg {
    max-width: 1000px;
}

@keyframes modalIn {

    from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


.modal-header {

    min-height: 65px;

    padding: 15px 20px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    background: #131922;

    border-bottom: 1px solid rgba(255,255,255,.07);

    flex-shrink: 0;
}

.modal-header h3 {

    margin: 0;

    color: #ffffff;

    font-size: 15px;

    font-weight: 750;
}

.modal-close {

    width: 35px;
    height: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 8px;

    border: 1px solid #303846;

    background: #1d242e;

    color: #8995a4;

    transition: var(--transition);
}

.modal-close:hover {

    color: #ffffff;

    border-color: var(--red);

    background: rgba(220,83,98,.10);
}

.modal-body {

    padding: 21px;

    overflow-y: auto;

    min-height: 0;
}

.modal-footer {

    padding: 14px 20px;

    display: flex;

    justify-content: flex-end;

    gap: 9px;

    background: #11161e;

    border-top: 1px solid rgba(255,255,255,.07);

    flex-shrink: 0;
}


/* ============================================================
   26. USER DETAIL HEADER
============================================================ */

.user-detail-head {

    padding: 17px;

    margin-bottom: 17px;

    display: flex;

    align-items: center;

    gap: 15px;

    border-radius: 13px;

    background:
        linear-gradient(
            110deg,
            rgba(22,135,217,.12),
            rgba(128,88,217,.08),
            rgba(217,164,65,.05)
        );

    border: 1px solid rgba(22,135,217,.18);
}

.detail-photo {

    width: 67px;
    height: 67px;

    object-fit: cover;

    border-radius: 15px;

    border: 2px solid #3b82b4;

    background: #0b0f14;
}

.user-detail-head h3 {

    margin: 0;

    color: #ffffff;

    font-size: 18px;
}

.user-detail-head p {

    margin: 4px 0 0;

    color: #788596;

    font-size: 10px;
}


/* ============================================================
   27. DETAIL GRID
============================================================ */

.detail-grid {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0,1fr));

    gap: 9px;

    margin-bottom: 17px;
}

.detail-box {

    min-height: 62px;

    padding: 11px 12px;

    border-radius: 9px;

    background: #10151d;

    border: 1px solid #252e3a;

    overflow: hidden;
}

.detail-box label {

    display: block;

    margin-bottom: 6px;

    color: #637080;

    font-size: 8px;

    text-transform: uppercase;

    letter-spacing: .55px;

    font-weight: 700;
}

.detail-box strong {

    display: block;

    color: #dce2e9;

    font-size: 10px;

    font-weight: 650;

    overflow-wrap: anywhere;
}


/* ============================================================
   28. DETAIL SECTIONS
============================================================ */

.detail-section {

    margin-top: 15px;

    padding: 16px;

    border-radius: 13px;

    background: #121821;

    border: 1px solid #28313d;

    position: relative;

    overflow: hidden;
}

.detail-section::before {

    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 3px;

    background: var(--blue);
}

.detail-section:nth-of-type(2)::before {
    background: var(--gold);
}

.detail-section:nth-of-type(3)::before {
    background: var(--green);
}

.detail-section:nth-of-type(4)::before {
    background: var(--purple);
}

.detail-section:nth-of-type(5)::before {
    background: var(--orange);
}

.detail-section:nth-of-type(6)::before {
    background: var(--cyan);
}

.detail-section h4 {

    margin: 0 0 12px;

    display: flex;
    align-items: center;

    gap: 8px;

    color: #e9edf2;

    font-size: 12px;

    font-weight: 750;
}

.detail-section h4::before {

    content: "\f03a";

    font-family: "Font Awesome 6 Free";

    font-weight: 900;

    width: 26px;
    height: 26px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 7px;

    color: var(--blue-light);

    background: rgba(22,135,217,.10);

    font-size: 10px;
}

.detail-section:nth-of-type(2) h4::before {

    content: "\f0a3";

    color: var(--gold-light);

    background: rgba(217,164,65,.10);
}

.detail-section:nth-of-type(3) h4::before {

    content: "\f201";

    color: var(--green-light);

    background: rgba(37,183,122,.10);
}

.detail-section:nth-of-type(4) h4::before {

    content: "\f0e0";

    color: var(--purple-light);

    background: rgba(128,88,217,.10);
}

.detail-section:nth-of-type(5) h4::before {

    content: "\f0f3";

    color: var(--orange-light);

    background: rgba(229,138,50,.10);
}

.detail-section:nth-of-type(6) h4::before {

    content: "\f1da";

    color: var(--cyan-light);

    background: rgba(24,168,184,.10);
}


/* ============================================================
   29. USER ACTIONS
============================================================ */

.modal-actions {

    padding: 13px;

    margin: 15px 0;

    display: flex;

    align-items: center;

    gap: 8px;

    flex-wrap: wrap;

    border-radius: 12px;

    background: #0e131a;

    border: 1px solid #27303b;
}

.modal-actions::before {

    content: "ACTIONS";

    margin-right: 3px;

    color: #596676;

    font-size: 8px;

    letter-spacing: 1px;

    font-weight: 800;
}


/* ============================================================
   30. EDIT FORM
============================================================ */

.field-row {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 13px;
}


/* ============================================================
   31. USER DETAIL CONTENT
============================================================ */

#userCertificates,
#userProgressList,
#userMessages,
#userNotifications,
#userActivity {

    color: #8995a4;

    font-size: 10px;

    line-height: 1.7;
}

#userCertificates > *,
#userProgressList > *,
#userMessages > *,
#userNotifications > *,
#userActivity > * {

    padding: 10px;

    margin-bottom: 7px;

    border-radius: 8px;

    background: #0e131a;

    border: 1px solid #222b36;
}


/* ============================================================
   32. PAYMENT / MESSAGE / CERTIFICATE MODALS
============================================================ */

#paymentModal .detail-grid,
#messageModal .detail-grid,
#certificateModal .detail-grid {
    margin-bottom: 0;
}

#paymentModalProof {

    min-height: 100px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #687586;

    border-style: dashed;
}

#paymentModalNote {

    color: #aab4c0;

    line-height: 1.7;
}


/* ============================================================
   33. TOAST
============================================================ */

#toastContainer {

    position: fixed;

    top: 82px;
    right: 22px;

    z-index: 3000;

    width: min(360px, calc(100vw - 30px));

    display: flex;

    flex-direction: column;

    gap: 9px;

    pointer-events: none;
}

#toastContainer > * {

    pointer-events: auto;
}


/* ============================================================
   34. ACTIVITY LIST
============================================================ */

#dashboardActivities,
#activitiesList {

    display: flex;

    flex-direction: column;

    gap: 8px;
}

#dashboardActivities > *,
#activitiesList > * {

    border-radius: 10px;

    background: #10151d;

    border: 1px solid #242d39;

    padding: 12px 13px;

    color: #aeb8c4;

    font-size: 10px;

    line-height: 1.6;

    transition: var(--transition);
}

#dashboardActivities > *:hover,
#activitiesList > *:hover {

    border-color: rgba(22,135,217,.25);

    background: #121923;

    transform: translateX(2px);
}


/* ============================================================
   35. INPUTS AUTOFILL
============================================================ */

input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {

    -webkit-text-fill-color: #ffffff;

    -webkit-box-shadow:
        0 0 0 1000px #0c1016 inset;

    transition:
        background-color 5000s ease-in-out 0s;
}


/* ============================================================
   36. FOCUS ACCESSIBILITY
============================================================ */

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {

    outline: 2px solid rgba(22,135,217,.65);

    outline-offset: 2px;
}


/* ============================================================
   37. MOBILE
============================================================ */

@media (max-width: 1200px) {

    .stats-grid {
        grid-template-columns:
            repeat(3, minmax(0,1fr));
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .dashboard-right {
        display: grid;

        grid-template-columns: 1fr 1fr;
    }

    .detail-grid {
        grid-template-columns:
            repeat(3, minmax(0,1fr));
    }

}


@media (max-width: 950px) {

    #sidebar {

        position: fixed;

        left: -280px;

        transition: left .3s ease;

        box-shadow:
            20px 0 50px rgba(0,0,0,.55);
    }

    #sidebar.mobile-open {
        left: 0;
    }

    #mobileMenu {
        display: flex;

        align-items: center;
        justify-content: center;
    }

    .topbar {
        padding: 0 18px;
    }

    .admin-display {
        display: none;
    }

    .content {
        padding: 20px;
    }

    .dashboard-right {

function firstValue(

    keys,
    fallback = null
) {

    if (!object) {
        return fallback;
    }

    for (const key of keys) {

        if (
            object[key] !== undefined &&
            object[key] !== null &&
            object[key] !== ""
        ) {

            return object[key];

        }

    }

    return fallback;

}


function isTrue(value) {

    return (
        value === true ||

        value === "1" ||
        value === "true" ||

function arrayFromResult(

) {

/* ============================================================
   API REQUEST
============================================================ */

async function apiRequest(
    path,
    options = {}
) {

    const headers = {

        "Content-Type":
            "application/json",

        ...(options.headers || {})

    };


    /*
     * TOKEN UNIQUEMENT EN MEMOIRE
     *
     * Aucun localStorage.
     * Aucun sessionStorage.
     */

    if (adminToken) {

        headers.Authorization =
            `Bearer ${adminToken}`;

        headers["x-admin-token"] =
            adminToken;

    }


    const response =
        await fetch(
            `${API_BASE}${path}`,
            {
                ...options,
                headers
            }
        );


    let data = null;

    try {

        data =
            await response.json();

    } catch {

        data = null;

    }


    if (!response.ok) {

        const error =
            new Error(
                data?.message ||
                data?.error ||
                `Erreur HTTP ${response.status}`
            );

        error.status =
            response.status;

        error.data =
            data;

        throw error;

    }


    return data;

}

async function loadUsers() {

    const tbody =
        getEl(
            "usersTableBody"
        );


    if (tbody) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        Chargement des utilisateurs...
                    </div>
                </td>
            </tr>
        `;

    }


    try {

        const result =
            await apiRequest(
                "/api/admin/users"
            );


        console.log(
            "[BMJ ADMIN] UTILISATEURS API :",
            result
        );


        allUsers =
            arrayFromResult(
                result,
                [
                    "users",
                    "utilisateurs",
                    "data"
                ]
            );


        /*
         * Sécurité :
         * on supprime du navigateur toute éventuelle
         * propriété password si le serveur faisait
         * l'erreur d'en retourner une.
         */

        allUsers =
            allUsers.map(
                user => {

                    const safe =
                        {
                            ...user
                        };

                    delete safe.password;

                    delete safe.mot_de_passe;

                    return safe;

                }
            );


        console.log(
            "[BMJ ADMIN] NOMBRE UTILISATEURS :",
            allUsers.length
        );


        console.log(
            "[BMJ ADMIN] PREMIER UTILISATEUR :",
            allUsers[0]
        );


        setText(
            "totalUsers",
            `Total : ${allUsers.length}`
        );


        setText(
            "usersBadge",
            allUsers.length
        );


        buildDomainFilter();


        populateUserSelects();


        currentUsersPage = 1;


        renderUsers();


        /*
         * Les statistiques doivent être recalculées
         * après récupération des utilisateurs.
         */

        await loadStatistics();


        return allUsers;


    } catch (error) {

        console.error(
            "[BMJ ADMIN] Erreur utilisateurs :",
            error
        );


        if (tbody) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="bmj-error-box">
                            Impossible de récupérer les utilisateurs :
                            ${escapeHTML(error.message)}
                        </div>
                    </td>
                </tr>
            `;

        }


        throw error;

    }

}


/* ============================================================
   FILTRE DOMAINES
============================================================ */

function buildDomainFilter() {

    const select =
        getEl(
            "userDomainFilter"
        );


    if (!select) {
        return;
    }


    const current =
        select.value;


    const domains =
        [
            ...new Set(
                allUsers
                    .map(
                        user =>
                            firstValue(
                                user,
                                [
                                    "domaine",
                                    "domain"
                                ],
                                ""
                            )
                    )
                    .filter(Boolean)
            )
        ]
        .sort(
            (a, b) =>
                String(a).localeCompare(
                    String(b),
                    "fr"
                )
        );


    select.innerHTML = `
        <option value="">
            Tous les domaines
        </option>
    `;


    domains.forEach(domain => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            domain;

        option.textContent =
            domain;

        select.appendChild(
            option
        );

    });


    if (
        domains.includes(current)
    ) {

        select.value =
            current;

    }

}

/* ============================================================
   FILTRER UTILISATEURS
============================================================ */

function getFilteredUsers() {

    const search =
        (
            getEl(
                "userSearch"
            )?.value ||
            ""
        )
        .trim()
        .toLowerCase();


    const filter =
        getEl(
            "userFilter"
        )?.value ||
        "";


    const domain =
        getEl(
            "userDomainFilter"
        )?.value ||
        "";


    return allUsers.filter(
        user => {

            const text =
                [
                    user.id,
                    user.nom,
                    user.name,
                    user.email,
                    user.telephone,
                    user.phone,
                    user.domaine,
                    user.domain,
                    user.pays,
                    user.country,
                    user.ville,
                    user.city,
                    user.niveau,
                    user.level,
                    user.sexe
                ]
                .filter(
                    value =>
                        value !== undefined &&
                        value !== null
                )
                .join(" ")
                .toLowerCase();


            if (
                search &&
                !text.includes(search)
            ) {

                return false;

            }


            if (
                filter === "premium" &&
                !getUserPremium(user)
            ) {

                return false;

            }


            if (
                filter === "standard" &&
                getUserPremium(user)
            ) {

                return false;

            }


            if (
                filter === "blocked" &&
                !getUserBlocked(user)
            ) {

                return false;

            }


            if (
                domain &&
                String(
                    firstValue(
                        user,
                        [
                            "domaine",
                            "domain"
                        ],
                        ""
                    )
                ) !== domain
            ) {

                return false;

            }


            return true;

        }
    );

}


/* ============================================================
   AFFICHAGE USERS
============================================================ */

function renderUsers() {

    const tbody =
        getEl(
            "usersTableBody"
        );


    if (!tbody) {
        return;
    }


    const filtered =
        getFilteredUsers();


    setText(
        "usersCount",
        `${filtered.length} utilisateur${filtered.length > 1 ? "s" : ""}`
    );


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filtered.length /
                USERS_PER_PAGE
            )
        );


    if (
        currentUsersPage >
        totalPages
    ) {

        currentUsersPage =
            totalPages;

    }


    const start =
        (
            currentUsersPage -
            1
        ) *
        USERS_PER_PAGE;


    const users =
        filtered.slice(
            start,
            start +
            USERS_PER_PAGE
        );


    setText(
        "usersPage",
        currentUsersPage
    );


    const previous =
        getEl(
            "usersPrev"
        );


    const next =
        getEl(
            "usersNext"
        );


    if (previous) {

        previous.disabled =
            currentUsersPage <= 1;

    }


    if (next) {

        next.disabled =
            currentUsersPage >= totalPages;

    }


    if (!users.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">
                        Aucun utilisateur trouvé.
                    </div>
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        users.map(
            user => {

                const id =
                    firstValue(
                        user,
                        ["id"],
                        ""
                    );


                const name =
                    firstValue(
                        user,
                        [
                            "nom",
                            "name"
                        ],
                        "Utilisateur"
                    );


                const email =
                    firstValue(
                        user,
                        ["email"],
                        "—"
                    );


                const domain =
                    firstValue(
                        user,
                        [
                            "domaine",
                            "domain"
                        ],
                        "—"
                    );


                const premium =
                    getUserPremium(
                        user
                    );


                const blocked =
                    getUserBlocked(
                        user
                    );


                const progression =
                    getProgress(
                        user
                    );


                return `

                    <tr>

                        <td>

                            <div
                                style="
                                    display:flex;
                                    align-items:center;
                                    gap:10px;
                                "
                            >

                                <img
                                    src="${
                                        escapeHTML(
                                            firstValue(
                                                user,
                                                [
                                                    "photo",
                                                    "photo_url",
                                                    "avatar"
                                                ],
                                                "images/user.png"
                                            )
                                        )
                                    }"
                                    alt=""
                                    style="
                                        width:42px;
                                        height:42px;
                                        border-radius:50%;
                                        object-fit:cover;
                                    "
                                    onerror="this.src='images/user.png'"
                                >

                                <div>

                                    <strong>
                                        ${escapeHTML(name)}
                                    </strong>

                                    <small
                                        style="
                                            display:block;
                                            color:#718096;
                                        "
                                    >
                                        ID : ${escapeHTML(id)}
                                    </small>

                                </div>

                            </div>

                        </td>


                        <td>
                            ${escapeHTML(email)}
                        </td>


                        <td>
                            ${escapeHTML(domain)}
                        </td>


                        <td>

                            ${
                                blocked
                                    ? `
                                        <span class="badge badge-danger">
                                            Bloqué
                                        </span>
                                      `
                                    : premium
                                        ? `
                                            <span class="badge badge-gold">
                                                Premium
                                            </span>
                                          `
                                        : `
                                            <span class="badge badge-primary">
                                                Standard
                                            </span>
                                          `
                            }

                        </td>


                        <td>

                            <strong>
                                ${progression}%
                            </strong>

                        </td>


                        <td>

                            <button
                                class="btn btn-primary btn-sm"
                                data-view-user="${escapeHTML(id)}"
                            >
                                <i class="fa-solid fa-eye"></i>
                                Voir
                            </button>

                        </td>

                    </tr>

                `;

            }
        )
        .join("");

    );

            );

            extractUser(

            );

         */

        const results =
            await Promise.allSettled(
                [

                    loadUserCertificates(
                        id
                    ),

                    loadUserMessages(
                        id
                    ),

                    loadUserNotifications(
                        id
                    ),

async function saveUser() {

    if (!selectedUserId) {

        return;

    }


    const name =
        getEl(
            "editUserName"
        ).value.trim();


    const email =
        getEl(
            "editUserEmail"
        ).value.trim();


    if (!name || !email) {

        await showDialog({

            type: "warning",

            title: "Informations manquantes",

            message:
                "Le nom et l'adresse email sont obligatoires."

        });

        return;

    }


    const confirmed =
        await showDialog({

            type: "warning",

            title: "Modifier cet utilisateur ?",

            message:
                "Les informations du compte vont être mises à jour.",

            confirmText:
                "Enregistrer",

            cancelText:
                "Annuler",

            showCancel:
                true

        });


    if (!confirmed) {
        return;
    }


    const button =
        getEl(
            "saveUserButton"
        );


    button.disabled =
        true;


    try {

        const body = {

            nom:
                name,

            email:
                email,

            telephone:
                getEl(
                    "editUserPhone"
                ).value.trim(),

            sexe:
                getEl(
                    "editUserSexe"
                ).value,

            pays:
                getEl(
                    "editUserCountry"
                ).value.trim(),

            ville:
                getEl(
                    "editUserCity"
                ).value.trim(),

            domaine:
                getEl(
                    "editUserDomain"
                ).value.trim(),

            niveau:
                getEl(
                    "editUserLevel"
                ).value.trim(),

            photo:
                getEl(
                    "editUserPhoto"
                ).value.trim(),

            notes_admin:
                getEl(
                    "editUserNotes"
                ).value.trim()

        };


        const result =
            await apiRequest(
                `/api/admin/users/${selectedUserId}`,
                {
                    method: "PATCH",
                    body:
                        JSON.stringify(body)
                }
            );


        console.log(
            "[BMJ ADMIN] UTILISATEUR MODIFIÉ :",
            result
        );


        closeModal(
            "editUserModal"
        );


        await showDialog({

            type: "success",

            title:
                "Utilisateur modifié",

            message:
                "Les informations de l'utilisateur ont été enregistrées."

        });


        await loadUsers();


        await loadUserDetails(
            selectedUserId
        );


    } catch (error) {

        console.error(
            error
        );


        await showDialog({

            type: "error",

            title:
                "Modification impossible",

            message:
                error.message

        });

    } finally {

        button.disabled =
            false;

    }

}

/* ============================================================
   AFFICHER PAIEMENTS
============================================================ */

function renderPayments() {

    const tbody =
        getEl(
            "paymentsTableBody"
        );


    if (!tbody) {
        return;
    }


    const filter =
        getEl(
            "paymentFilter"
        )?.value ||
        "";


    let payments =
        allPayments;


    if (filter) {

        payments =
            payments.filter(
                payment => {

                    const status =
                        normalizeStatus(
                            firstValue(
                                payment,
                                [
                                    "statut",
                                    "status"
                                ],
                                ""
                            )
                        );


                    if (
                        filter === "pending"
                    ) {

                        return [
                            "pending",
                            "en_attente",
                            "attente",
                            "en attente"
                        ].includes(status);

                    }


                    if (
                        filter === "validated"
                    ) {

                        return [
                            "validated",
                            "valide",
                            "validé",
                            "approved",
                            "approuve"
                        ].includes(status);

                    }


                    if (
                        filter === "refused"
                    ) {

                        return [
                            "refused",
                            "refuse",
                            "refusé",
                            "rejected"
                        ].includes(status);

                    }


                    return true;

                }
            );

    }


    let pending = 0;
    let validated = 0;
    let refused = 0;
    let revenue = 0;


    allPayments.forEach(
        payment => {

            const status =
                normalizeStatus(
                    firstValue(
                        payment,
                        [
                            "statut",
                            "status"
                        ],
                        ""
                    )
                );


            const amount =
                Number(
                    firstValue(
                        payment,
                        [
                            "montant",
                            "amount",
                            "prix"
                        ],
                        0
                    )
                );


            if (
                [
                    "pending",
                    "en_attente",
                    "attente",
                    "en attente"
                ].includes(status)
            ) {

                pending++;

            }


            if (
                [
                    "validated",
                    "valide",
                    "validé",
                    "approved",
                    "approuve"
                ].includes(status)
            ) {

                validated++;

                revenue +=
                    amount;

            }


            if (
                [
                    "refused",
                    "refuse",
                    "refusé",
                    "rejected"
                ].includes(status)
            ) {

                refused++;

            }

        }
    );


    setText(
        "payTotal",
        allPayments.length
    );


    setText(
        "payPending",
        pending
    );


    setText(
        "payValidated",
        validated
    );


    setText(
        "payRefused",
        refused
    );


    setText(
        "payRevenue",
        formatMoney(
            revenue
        )
    );


    setText(
        "paymentsBadge",
        pending
    );


    if (!payments.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    <div class="empty">
                        Aucun paiement.
                    </div>
                </td>
            </tr>

    }


    tbody.innerHTML =
