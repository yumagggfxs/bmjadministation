async function sendAdminMessage() {

    const audience =
        getEl(
            "modalMessageAudience"
        ).value;


    const userId =
        getEl(
            "modalMessageUser"
        ).value;


    const subject =
        getEl(
            "modalMessageSubject"
        ).value.trim();


    const priority =
        getEl(
            "modalMessagePriority"
        ).value;


    const message =
        getEl(
            "modalMessageText"
        ).value.trim();


    if (
        audience === "user" &&
        !userId
    ) {

        await showDialog({

            type: "warning",

            title:
                "Utilisateur requis",

            message:
                "Sélectionnez le destinataire."

        });

        return;

    }


    if (!message) {

        await showDialog({

            type: "warning",

            title:
                "Message vide",

            message:
                "Écrivez un message avant de l'envoyer."

        });

        return;

    }


    const confirmed =
        await showDialog({

            type: "warning",

            title:
                "Envoyer le message ?",

            message:
                "Le message sera envoyé aux destinataires sélectionnés.",

            confirmText:
                "Envoyer",

            cancelText:
                "Annuler",

            showCancel:
                true

        });


    if (!confirmed) {
        return;
    }


    try {

        let route = "";


        if (
            audience === "user"
        ) {

            route =
                "/api/admin/messages/user";

        } else if (
            audience === "premium"
        ) {

            route =
                "/api/admin/messages/premium";

        } else if (
            audience === "standard"
        ) {

            route =
                "/api/admin/messages/standard";

        } else {

            route =
                "/api/admin/messages/all";

        }


        const body = {

            user_id:
                audience === "user"
                    ? Number(
                        userId
                    )
                    : undefined,

            subject:
                subject,

            message:
                message,

            priority:
                priority

        };


        const result =
            await apiRequest(
                route,
                {
                    method: "POST",
                    body:
                        JSON.stringify(
                            body
                        )
                }
            );


        console.log(
            "[BMJ ADMIN] MESSAGE ENVOYÉ :",
            result
        );


        closeModal(
            "messageModal"
        );


        await showDialog({

            type: "success",

            title:
                "Message envoyé",

            message:
                "Le message a été transmis avec succès."

        });


        getEl(
            "modalMessageSubject"
        ).value =
            "";


        getEl(
            "modalMessageText"
        ).value =
            "";


    } catch (error) {

        await showDialog({

            type: "error",

            title:
                "Envoi impossible",

            message:
                error.message

        });

    }

}


/* ============================================================
   CERTIFICATS GLOBAUX
============================================================ */

async function loadCertificates() {

    /*
     * Le serveur expose les certificats par utilisateur.
     * On les récupère donc via les utilisateurs.
     */

    allCertificates = [];


    const users =
        allUsers.slice();


    for (
        const user of users
    ) {

        const id =
            firstValue(
                user,
                ["id"],
                null
            );


        if (!id) {
            continue;
        }


        try {

            const result =
                await apiRequest(
                    `/api/admin/users/${id}/certificates`
                );


            const certificates =
                arrayFromResult(
                    result,
                    [
                        "certificates",
                        "certificats",
                        "data"
                    ]
                );


            certificates.forEach(
                certificate => {

                    allCertificates.push({

                        ...certificate,

                        user_id:
                            id,

                        user_name:
                            firstValue(
                                user,
                                [
                                    "nom",
                                    "name"
                                ],
                                "Utilisateur"
                            ),

                        user_email:
                            firstValue(
                                user,
                                [
                                    "email"
                                ],
                                ""
                            )

                    });

                }
            );


        } catch (error) {

            console.warn(
                `Certificats ${id} indisponibles`,
                error
            );

        }

    }


    renderCertificates();

}


function renderCertificates() {

    const tbody =
        getEl(
            "certificatesTableBody"
        );


    if (!tbody) {
        return;
    }


    const search =
        (
            getEl(
                "certificateSearch"
            )?.value ||
            ""
        )
        .toLowerCase()
        .trim();


    const certificates =
        allCertificates.filter(
            cert => {

                if (!search) {
                    return true;
                }


                const text =
                    [
                        cert.user_name,
                        cert.user_email,
                        cert.domaine,
                        cert.domain,
                        cert.title,
                        cert.titre,
                        cert.url
                    ]
                    .join(" ")
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    if (!certificates.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="5">
                    Aucun certificat trouvé.
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        certificates.map(
            cert => {

                const title =
                    firstValue(
                        cert,
                        [
                            "title",
                            "titre"
                        ],
                        "Certificat"
                    );


                const domain =
                    firstValue(
                        cert,
                        [
                            "domaine",
                            "domain"
                        ],
                        "—"
                    );


                const url =
                    firstValue(
                        cert,
                        [
                            "url",
                            "certificate_url",
                            "certificat_url"
                        ]
                    );


                return `

                    <tr>

                        <td>

                            <strong>
                                ${escapeHTML(
                                    cert.user_name
                                )}
                            </strong>

                            <small
                                style="
                                    display:block;
                                    color:#718096;
                                "
                            >
                                ${escapeHTML(
                                    cert.user_email
                                )}
                            </small>

                        </td>

                        <td>
                            ${escapeHTML(domain)}
                        </td>

                        <td>
                            ${escapeHTML(title)}
                        </td>

                        <td>

                            ${
                                url
                                    ? `
                                        <a
                                            href="${escapeHTML(url)}"
                                            target="_blank"
                                            rel="noopener"
                                        >
                                            Voir
                                        </a>
                                      `
                                    : "—"
                            }

                        </td>

                        <td>

                            <button
                                class="btn btn-primary btn-sm"
                                data-certificate-user="${escapeHTML(
                                    cert.user_id
                                )}"
                            >
                                <i class="fa-solid fa-user"></i>
                                Utilisateur
                            </button>

                        </td>

                    </tr>

                `;

            }
        ).join("");

}

                section.classList.toggle(
                    "active",
                    section.id === sectionId
                );

            }
        );


    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(
            item => {

                item.classList.toggle(
                    "active",
                    item.dataset.section === sectionId
                );

            }
        );


    const titles = {

        "section-dashboard":
            "Vue générale",

        "section-users":
            "Utilisateurs",

        "section-payments":
            "Paiements",

        "section-messages":
            "Messages",

        "section-certificates":
            "Certificats",

        "section-activities":
            "Activités",

        "section-health":
            "Santé du serveur"

    };


    setText(
        "topTitle",
        titles[sectionId] ||
        "Administration"
    );


    const sidebar =
        getEl(
            "sidebar"
        );


    if (sidebar) {

        sidebar.classList.remove(
            "mobile-open"
        );

    }

}


/* ============================================================
   LOGOUT
============================================================ */

async function logout() {

    const confirmed =
        await showDialog({

            type: "warning",

            title:
                "Se déconnecter ?",

            message:
                "Votre session administrateur sera fermée.",

            confirmText:
                "Déconnexion",

            cancelText:
                "Annuler",

            showCancel:
                true

        });


    if (!confirmed) {
        return;
    }


    try {

        if (adminToken) {

            await apiRequest(
                "/api/admin/login",
                {
                    method: "DELETE"
                }
            );

        }

    } catch (error) {

        console.warn(
            "Déconnexion serveur :",
            error
        );

    }


    adminToken =
        "";

    adminEmail =
        "";

    selectedUserId =
        null;

    selectedUser =
        null;


    getEl(
        "adminApp"
    ).style.display =
        "none";


    getEl(
        "adminLogin"
    ).style.display =
        "flex";


    getEl(
        "adminPassword"
    ).value =
        "";


    await showDialog({

        type: "success",

        title:
            "Déconnexion réussie",

        message:
            "La session administrateur a été fermée."

    });

}


/* ============================================================
   EVENEMENTS
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        installDialog();


        /*
         * Au départ :
         * login visible,
         * dashboard caché.
         */

        const app =
            getEl(
                "adminApp"
            );


        if (app) {

            app.style.display =
                "none";

        }


        const login =
            getEl(
                "adminLogin"
            );


        if (login) {

            login.style.display =
                "flex";

        }


        /*
         * LOGIN
         */

        getEl(
            "adminLoginForm"
        )?.addEventListener(
            "submit",
            adminLogin
        );


        /*
         * NAVIGATION
         */

        document.addEventListener(
            "click",
            event => {

                const nav =
                    event.target.closest(
                        "[data-section]"
                    );


                if (nav) {

                    showSection(
                        nav.dataset.section
                    );

                    return;

                }


                const viewUser =
                    event.target.closest(
                        "[data-view-user]"
                    );


                if (viewUser) {

                    loadUserDetails(
                        viewUser.dataset.viewUser
                    );

                    return;

                }


                const payment =
                    event.target.closest(
                        "[data-payment-id]"
                    );


                if (payment) {

                    openPayment(
                        payment.dataset.paymentId
                    );

                    return;

                }


                const certUser =
                    event.target.closest(
                        "[data-certificate-user]"
                    );


                if (certUser) {

                    loadUserDetails(
                        certUser.dataset.certificateUser
                    );

                    return;

                }


                const action =
                    event.target.closest(
                        "[data-user-action]"
                    );


                if (action) {

                    const type =
                        action.dataset.userAction;


                    if (
                        type === "edit"
                    ) {

                        openEditUser();

                    }


                    if (
                        type === "premium"
                    ) {

                        togglePremium();

                    }


                    if (
                        type === "block"
                    ) {

                        blockUser();

                    }


                    if (
                        type === "unblock"
                    ) {

                        unblockUser();

                    }


                    if (
                        type === "certificate"
                    ) {

                        openCertificateForUser();

                    }

                }

            }
        );


        /*
         * FERMETURE MODALES
         */

        document.addEventListener(
            "click",
            event => {

                const close =
                    event.target.closest(
                        "[data-close-modal]"
                    );


                if (close) {

                    closeModal(
                        close.dataset.closeModal
                    );

                }

            }
        );


        /*
         * RECHERCHE
         */

        getEl(
            "userSearch"
        )?.addEventListener(
            "input",
            () => {

                currentUsersPage =
                    1;

                renderUsers();

            }
        );


        getEl(
            "userFilter"
        )?.addEventListener(
            "change",
            () => {

                currentUsersPage =
                    1;

                renderUsers();

            }
        );


        getEl(
            "userDomainFilter"
        )?.addEventListener(
            "change",
            () => {

                currentUsersPage =
                    1;

                renderUsers();

            }
        );


        getEl(
            "certificateSearch"
        )?.addEventListener(
            "input",
            renderCertificates
        );


        getEl(
            "paymentFilter"
        )?.addEventListener(
            "change",
            renderPayments
        );


        /*
         * PAGINATION
         */

        getEl(
            "usersPrev"
        )?.addEventListener(
            "click",
            () => {

                if (
                    currentUsersPage >
                    1
                ) {

                    currentUsersPage--;

                    renderUsers();

                }

            }
        );


        getEl(
            "usersNext"
        )?.addEventListener(
            "click",
            () => {

                const total =
                    getFilteredUsers()
                        .length;


                const pages =
                    Math.max(
                        1,
                        Math.ceil(
                            total /
                            USERS_PER_PAGE
                        )
                    );


                if (
                    currentUsersPage <
                    pages
                ) {

                    currentUsersPage++;

                    renderUsers();

                }

            }
        );


        /*
         * ACTUALISATION
         */

        getEl(
            "refreshAll"
        )?.addEventListener(
            "click",
            async () => {

                toast(
                    "Actualisation en cours...",
                    "info"
                );

                await loadEverything();

                toast(
                    "Données actualisées.",
                    "success"
                );

            }
        );


        getEl(
            "usersRefresh"
        )?.addEventListener(
            "click",
            async () => {

                await loadUsers();

                toast(
                    "Utilisateurs actualisés.",
                    "success"
                );

            }
        );


        getEl(
            "paymentsRefresh"
        )?.addEventListener(
            "click",
            async () => {

                await loadPayments();

                toast(
                    "Paiements actualisés.",
                    "success"
                );

            }
        );


        getEl(
            "activitiesRefresh"
        )?.addEventListener(
            "click",
            async () => {

                await loadActivities();

                toast(
                    "Activités actualisées.",
                    "success"
                );

            }
        );


        getEl(
            "healthRefresh"
        )?.addEventListener(
            "click",
            async () => {

                await loadHealth();

                await loadDatabaseHealth();

                toast(
                    "État du serveur vérifié.",
                    "success"
                );

            }
        );


        /*
         * MOBILE MENU
         */

        getEl(
            "mobileMenu"
        )?.addEventListener(
            "click",
            () => {

                getEl(
                    "sidebar"
                )?.classList.toggle(
                    "mobile-open"
                );

            }
        );


        /*
         * LOGOUT
         */

        getEl(
            "logoutButton"
        )?.addEventListener(
            "click",
            logout
        );


        /*
         * EDIT
         */

        getEl(
            "saveUserButton"
        )?.addEventListener(
            "click",
            saveUser
        );


        /*
         * PREMIUM / BLOCK / CERTIFICAT
         * sont traités par délégation.
         */


        /*
         * PAIEMENT
         */

        getEl(
            "paymentValidateButton"
        )?.addEventListener(
            "click",
            validatePayment
        );


        getEl(
            "paymentRefuseButton"
        )?.addEventListener(
            "click",
            refusePayment
        );


        /*
         * MESSAGE
         */

        getEl(
            "openMessageModal"
        )?.addEventListener(
            "click",
            () => {

                populateUserSelects();

                updateMessageAudience();

                openModal(
                    "messageModal"
                );

            }
        );


        getEl(
            "modalMessageAudience"
        )?.addEventListener(
            "change",
            updateMessageAudience
        );


        getEl(
            "modalSendMessage"
        )?.addEventListener(
            "click",
            sendAdminMessage
        );


        /*
         * CERTIFICAT
         */

        getEl(
            "createCertificateButton"
        )?.addEventListener(
            "click",
            () => {

                populateUserSelects();

                openModal(
                    "certificateModal"
                );

            }
        );


        getEl(
            "createCertificateConfirm"
        )?.addEventListener(
            "click",
            createCertificate
        );


        /*
         * SELECTION CERTIFICAT
         */

        getEl(
            "certificateUser"
        )?.addEventListener(
            "change",
            () => {

                const id =
                    Number(
                        getEl(
                            "certificateUser"
                        ).value
                    );


                const user =
                    allUsers.find(
                        item =>
                            Number(
                                item.id
                            ) === id
                    );


                if (!user) {
                    return;
                }


                getEl(
                    "certificateDomain"
                ).value =
                    firstValue(
                        user,
                        [
                            "domaine",
                            "domain"
                        ],
                        ""
                    );

            }
        );


        /*
         * FERMER EN CLIQUANT HORS MODAL
         */

        document.addEventListener(
            "click",
            event => {

                document
                    .querySelectorAll(
                        ".modal"
                    )
                    .forEach(
                        modal => {

                            if (
                                event.target ===
                                modal
                            ) {

                                closeModal(
                                    modal.id
                                );

                            }

                        }
                    );

            }
        );


    }
);

</script>

</body>
</html>
