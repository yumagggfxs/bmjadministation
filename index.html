<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration - BMJ SERVICE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #334155; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .admin-login-card {
            background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; padding: 40px 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); position: relative; overflow: hidden;
        }
        .admin-login-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
        }
        .admin-header { text-align: center; margin-bottom: 30px; }
        .admin-icon {
            width: 60px; height: 60px; background: #eff6ff; color: #2563eb; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center; border-radius: 50%; margin: 0 auto 15px auto;
        }
        .admin-header h1 { font-size: 1.4rem; color: #0f172a; font-weight: 700; margin-bottom: 5px; }
        .admin-header p { font-size: 0.85rem; color: #64748b; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 8px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 14px; color: #94a3b8; }
        .input-wrapper input {
            width: 100%; padding: 12px 14px 12px 42px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;
        }
        .input-wrapper input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .btn-submit {
            width: 100%; padding: 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease; margin-top: 10px;
        }
        .btn-submit:hover { background: #1d4ed8; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { font-size: 0.85rem; color: #64748b; text-decoration: none; }
        .back-link a:hover { color: #2563eb; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="admin-header">
            <div class="admin-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1>Portail Direction</h1>
            <p>Accès hautement sécurisé</p>
        </div>

        <form id="formAdminConnexion">
            <div class="input-group">
                <label for="email">E-mail administrateur</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" required placeholder="direction@directionbmj.com">
                </div>
            </div>

            <div class="input-group">
                <label for="secretKey">Clé secrète administrateur</label>
                <div class="input-wrapper">
                    <i class="fa-solid key"></i>
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="secretKey" required placeholder="••••••••••••••••">
                </div>
            </div>

            <button type="submit" id="btnConnexion" class="btn-submit">Authentification sécurisée</button>
        </form>

        <div class="back-link">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Retour au site principal</a>
        </div>
    </div>

    <script>
       // ==========================================================
// BMJ SERVICE
// CONNEXION ADMINISTRATEUR
// RENDER + POSTGRESQL
// ==========================================================


// ==========================================================
// 1. CONFIGURATION API
// ==========================================================

const API_URL = "https://back-end-h602.onrender.com";


// ==========================================================
// 2. POPUP ADMIN
// ==========================================================

function afficherPopupAdmin(
    titre,
    message,
    type = "error",
    callback = null
) {

    let overlay =
        document.getElementById("bmjAdminModal");

    // Créer le popup s'il n'existe pas

    if (!overlay) {

        overlay = document.createElement("div");

        overlay.id = "bmjAdminModal";

        overlay.innerHTML = `

            <div class="bmj-admin-modal-box">

                <div
                    id="bmjAdminModalIcon"
                    class="bmj-admin-modal-icon">
                    ⚠️
                </div>

                <h3
                    id="bmjAdminModalTitle">
                    Notification
                </h3>

                <p
                    id="bmjAdminModalText">
                    Message
                </p>

                <button
                    type="button"
                    id="bmjAdminModalBtn">
                    Compris
                </button>

            </div>
        `;

        document.body.appendChild(overlay);


        // ==================================================
        // STYLE
        // ==================================================

        const style =
            document.createElement("style");

        style.innerHTML = `

            #bmjAdminModal {

                position: fixed;

                inset: 0;

                background:
                    rgba(15,23,42,0.68);

                backdrop-filter:
                    blur(7px);

                display: flex;

                align-items: center;
                justify-content: center;

                padding: 15px;

                box-sizing: border-box;

                z-index: 999999;

                opacity: 0;

                visibility: hidden;

                transition:
                    opacity .25s ease,
                    visibility .25s ease;
            }


            #bmjAdminModal.active {

                opacity: 1;

                visibility: visible;
            }


            .bmj-admin-modal-box {

                width: 100%;

                max-width: 390px;

                background: #fff;

                border-radius: 18px;

                padding: 28px 22px;

                text-align: center;

                box-shadow:
                    0 25px 60px
                    rgba(0,0,0,.20);

                transform:
                    translateY(20px)
                    scale(.97);

                transition:
                    transform .25s ease;
            }


            #bmjAdminModal.active
            .bmj-admin-modal-box {

                transform:
                    translateY(0)
                    scale(1);
            }


            .bmj-admin-modal-icon {

                font-size: 48px;

                margin-bottom: 12px;
            }


            .bmj-admin-modal-box h3 {

                margin: 0 0 10px;

                color: #172033;

                font-size: 21px;

                font-weight: 700;
            }


            .bmj-admin-modal-box p {

                margin: 0 0 22px;

                color: #64748b;

                line-height: 1.6;

                font-size: 14px;
            }


            #bmjAdminModalBtn {

                width: 100%;

                border: none;

                border-radius: 11px;

                padding: 13px;

                background: #2563eb;

                color: white;

                font-size: 15px;

                font-weight: 600;

                cursor: pointer;
            }


            #bmjAdminModalBtn:hover {

                opacity: .9;
            }

        `;

        document.head.appendChild(style);
    }


    // ======================================================
    // RÉCUPÉRER LES ÉLÉMENTS
    // ======================================================

    const icon =
        document.getElementById(
            "bmjAdminModalIcon"
        );

    const title =
        document.getElementById(
            "bmjAdminModalTitle"
        );

    const text =
        document.getElementById(
            "bmjAdminModalText"
        );

    const button =
        document.getElementById(
            "bmjAdminModalBtn"
        );


    title.textContent = titre;

    text.innerHTML = message;


    // ======================================================
    // TYPE
    // ======================================================

    if (type === "success") {

        icon.textContent = "✅";

        button.style.background =
            "#16a34a";

    } else if (type === "warning") {

        icon.textContent = "⚠️";

        button.style.background =
            "#f59e0b";

    } else {

        icon.textContent = "❌";

        button.style.background =
            "#2563eb";
    }


    overlay.classList.add("active");


    // ======================================================
    // ÉVITER LES DOUBLONS D'ÉVÉNEMENTS
    // ======================================================

    const nouveauButton =
        button.cloneNode(true);

    button.parentNode.replaceChild(
        nouveauButton,
        button
    );


    nouveauButton.addEventListener(
        "click",
        function () {

            overlay.classList.remove(
                "active"
            );


            if (
                typeof callback ===
                "function"
            ) {

                callback();
            }

        }
    );
}


// ==========================================================
// 3. CONNEXION ADMIN
// ==========================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const formAdminConnexion =
            document.getElementById(
                "formAdminConnexion"
            );


        if (!formAdminConnexion) {

            console.warn(
                "BMJ ADMIN : formulaire formAdminConnexion introuvable."
            );

            return;
        }


        formAdminConnexion.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();


                // ==========================================
                // RÉCUPÉRER LES CHAMPS
                // ==========================================

                const emailInput =
                    document.getElementById(
                        "email"
                    );


                const secretKeyInput =
                    document.getElementById(
                        "secretKey"
                    );


                const btnConnexion =
                    document.getElementById(
                        "btnConnexion"
                    );


                const email =
                    emailInput
                        ? emailInput.value
                            .trim()
                            .toLowerCase()
                        : "";


                const secretKey =
                    secretKeyInput
                        ? secretKeyInput.value
                        : "";


                // ==========================================
                // VALIDATION
                // ==========================================

                if (!email || !secretKey) {

                    afficherPopupAdmin(

                        "Champs requis",

                        "Veuillez saisir votre adresse email et votre clé secrète.",

                        "warning"

                    );

                    return;
                }


                // ==========================================
                // BOUTON
                // ==========================================

                if (btnConnexion) {

                    btnConnexion.disabled =
                        true;

                    btnConnexion.innerHTML = `

                        <i class="fa-solid fa-spinner fa-spin"></i>

                        Vérification...

                    `;
                }


                try {

                    // ======================================
                    // APPEL API RENDER
                    // ======================================

                    const reponse =
                        await fetch(

                            API_URL +
                            "/api/admin/connexion",

                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        email:
                                            email,

                                        secretKey:
                                            secretKey

                                    })

                            }

                        );


                    // ======================================
                    // RÉCUPÉRER JSON
                    // ======================================

                    let resultat;


                    try {

                        resultat =
                            await reponse.json();

                    } catch (erreurJSON) {

                        throw new Error(
                            "Le serveur a retourné une réponse invalide."
                        );
                    }


                    console.log(
                        "Réponse admin :",
                        resultat
                    );


                    // ======================================
                    // AUTHENTIFICATION RÉUSSIE
                    // ======================================

                    if (

                        reponse.ok &&

                        resultat.success ===
                        true &&

                        resultat.data

                    ) {


                        const admin =
                            resultat.data;


                        // ----------------------------------
                        // SAUVEGARDER ADMIN
                        // ----------------------------------

                        localStorage.setItem(

                            "bmj_current_user",

                            JSON.stringify(
                                admin
                            )

                        );


                        // ----------------------------------
                        // SESSION ADMIN
                        // ----------------------------------

                        localStorage.setItem(

                            "bmj_admin_logged",

                            "true"

                        );


                        // ----------------------------------
                        // IDENTIFIER LE TYPE DE COMPTE
                        // ----------------------------------

                        admin.role =
                            admin.role ||
                            "admin";


                        localStorage.setItem(

                            "bmj_admin_data",

                            JSON.stringify(
                                admin
                            )

                        );


                        // ==================================
                        // SUCCÈS
                        // ==================================

                        afficherPopupAdmin(

                            "Authentification réussie",

                            `

                            Bienvenue
                            <strong>
                                ${
                                    admin.nom ||
                                    admin.name ||
                                    "Administrateur"
                                }
                            </strong>.

                            <br><br>

                            Accès au tableau
                            d'administration...

                            `,

                            "success",

                            function () {

                                window.location.href =
                                    "admin.html";

                            }

                        );

                    }


                    // ======================================
                    // AUTHENTIFICATION REFUSÉE
                    // ======================================

                    else {

                        const message =
                            resultat.error ||
                            resultat.message ||
                            "Email ou clé secrète incorrecte.";


                        afficherPopupAdmin(

                            "Accès refusé",

                            message,

                            "error"

                        );


                        if (btnConnexion) {

                            btnConnexion.disabled =
                                false;

                            btnConnexion.innerHTML = `

                                <i class="fa-solid fa-shield-halved"></i>

                                Authentification sécurisée

                            `;
                        }

                    }

                }


                // ==========================================
                // ERREUR RÉSEAU
                // ==========================================

                catch (erreur) {

                    console.error(
                        "Erreur connexion admin :",
                        erreur
                    );


                    afficherPopupAdmin(

                        "Serveur indisponible",

                        `

                        Impossible de contacter
                        le serveur BMJ SERVICE.

                        <br><br>

                        Vérifiez votre connexion Internet
                        puis réessayez.

                        `,

                        "error"

                    );


                    if (btnConnexion) {

                        btnConnexion.disabled =
                            false;

                        btnConnexion.innerHTML = `

                            <i class="fa-solid fa-shield-halved"></i>

                            Authentification sécurisée

                        `;
                    }

                }

            }
        );

    }
);
    </script>
</body>
</html>
